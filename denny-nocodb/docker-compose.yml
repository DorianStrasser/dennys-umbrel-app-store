version: '2.1'
services: 
  nocodb: 
    depends_on: 
      root_db: 
        condition: service_healthy
    environment: 
      NC_DB: "pg://root_db:5432?u=postgres&p=password&d=root_db"
    image: nocodb/nocodb:0.265.0@sha256:a3d37f6cacef4ec342abba884da8d8bd35c09d6ef9ebfd4538c51d7bd6854e18
    ports: 
      - "8096:8080"
    restart: always
    volumes: 
      - ${APP_DATA_DIR}/data/nc_data:/usr/app/data
  root_db: 
    environment: 
      POSTGRES_DB: root_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck: 
      interval: 10s
      retries: 10
      test: "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
      timeout: 2s
    image: postgres
    restart: always
    volumes: 
      - ${APP_DATA_DIR}/data/db_data:/var/lib/postgresql/data"
volumes: 
  db_data: {}
  nc_data: {}

